<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #fffdf8; }
    .lane { fill: #ffffff; stroke: #4f5664; stroke-width: 1.1; }
    .t { fill: #171b18; font-size: 13px; font-weight: 600; }
    .body { fill: #171b18; font-size: 12px; }
    .sub { fill: #737a73; font-size: 11.5px; }
    .code { fill: #737a73; font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; }
    .card { fill: #ffffff; stroke: #b9c4bf; stroke-width: 1.1; }
    .cid { fill: #171b18; font-size: 11.5px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
    .sup { fill: #1d7a3e; font-size: 10.5px; font-weight: 600; }
    .con { fill: #b4372b; font-size: 10.5px; font-weight: 600; }
    .qua { fill: #b4782b; font-size: 10.5px; font-weight: 600; }
    .flag { fill: rgba(180,120,30,0.10); stroke: #b4782b; stroke-width: 1.3; }
    .flagtext { fill: #b4782b; font-size: 12px; font-weight: 600; }
    .ok { fill: rgba(29,122,62,0.10); stroke: #1d7a3e; stroke-width: 1.3; }
    .oktext { fill: #1d7a3e; font-size: 12px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d19; }
      .lane { fill: #2a2d27; stroke: #c9c6bc; }
      .card { fill: #1b1d19; stroke: #4a504a; }
      .t, .body, .cid { fill: #f3efe6; }
      .sub, .code { fill: #98968d; }
      .sup { fill: #5fd08a; }
      .con { fill: #ff8a7d; }
      .qua { fill: #f0b45a; }
      .flag { fill: rgba(240,180,90,0.12); stroke: #f0b45a; }
      .flagtext { fill: #f0b45a; }
      .ok { fill: rgba(95,208,138,0.12); stroke: #5fd08a; }
      .oktext { fill: #5fd08a; }
    }
  </style>
  <rect class="bg" width="760" height="270"/>
  <text class="t" x="380" y="26" text-anchor="middle">组装时按问题看卡片立场：有来源 ≠ 被检验过</text>

  <rect class="lane" x="24" y="46" width="712" height="100" rx="8"/>
  <text class="t" x="40" y="68">Q1 摘要式 memory 会丢事实吗</text>
  <text class="code" x="40" y="86">cards 3 · sources 3 · dissenting_cards 0</text>
  <rect class="card" x="40" y="98" width="130" height="36" rx="6"/>
  <text class="cid" x="50" y="113">[c1]</text><text class="sub" x="92" y="113">作者论文</text>
  <text class="sup" x="50" y="127">supports</text>
  <rect class="card" x="182" y="98" width="130" height="36" rx="6"/>
  <text class="cid" x="192" y="113">[c2]</text><text class="sub" x="234" y="113">作者博客</text>
  <text class="sup" x="192" y="127">supports</text>
  <rect class="card" x="324" y="98" width="130" height="36" rx="6"/>
  <text class="cid" x="334" y="113">[a1]</text><text class="sub" x="376" y="113">转述新闻</text>
  <text class="sup" x="334" y="127">supports</text>
  <rect class="flag" x="470" y="92" width="250" height="44" rx="8"/>
  <text class="flagtext" x="595" y="110" text-anchor="middle">全是支持，没有一张反对或限定</text>
  <text class="sub" x="595" y="127" text-anchor="middle">guidance：先读最强的批评再定论</text>

  <rect class="lane" x="24" y="160" width="712" height="100" rx="8"/>
  <text class="t" x="40" y="182">Q2 任务多长开始出问题</text>
  <text class="code" x="40" y="200">cards 3 · sources 3 · dissenting_cards 2</text>
  <rect class="card" x="40" y="212" width="130" height="36" rx="6"/>
  <text class="cid" x="50" y="227">[c4]</text><text class="sub" x="92" y="227">作者测量</text>
  <text class="sup" x="50" y="241">supports</text>
  <rect class="card" x="182" y="212" width="130" height="36" rx="6"/>
  <text class="cid" x="192" y="227">[b2]</text><text class="sub" x="234" y="227">独立复现</text>
  <text class="qua" x="192" y="241">qualifies</text>
  <rect class="card" x="324" y="212" width="130" height="36" rx="6"/>
  <text class="cid" x="334" y="227">[c7]</text><text class="sub" x="376" y="227">生产记录</text>
  <text class="con" x="334" y="241">contradicts</text>
  <rect class="ok" x="470" y="206" width="250" height="44" rx="8"/>
  <text class="oktext" x="595" y="224" text-anchor="middle">答案经过了反证的检验</text>
  <text class="sub" x="595" y="241" text-anchor="middle">报告要写出立场、置信度和最强反证</text>
</svg>
