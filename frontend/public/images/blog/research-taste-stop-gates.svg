<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #fffdf8; }
    .step { fill: #ffffff; stroke: #4f5664; stroke-width: 1.1; }
    .t { fill: #171b18; font-size: 13px; font-weight: 600; }
    .body { fill: #171b18; font-size: 12px; }
    .sub { fill: #737a73; font-size: 11px; }
    .code { fill: #737a73; font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; }
    .ok { fill: rgba(29,122,62,0.10); stroke: #1d7a3e; stroke-width: 1.3; }
    .oktext { fill: #1d7a3e; font-size: 12px; font-weight: 600; }
    .no { fill: rgba(180,55,43,0.10); stroke: #b4372b; stroke-width: 1.3; }
    .notext { fill: #b4372b; font-size: 12px; font-weight: 600; }
    .check { fill: rgba(180,120,30,0.08); stroke: #b4782b; stroke-width: 1.2; }
    .flow { stroke: #4f5664; stroke-width: 1.2; fill: none; marker-end: url(#arrow2); }
    .lbl { fill: #4f5664; font-size: 11px; }
    .store { fill: #ffffff; stroke: #b9c4bf; stroke-width: 1.1; stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d19; }
      .step { fill: #2a2d27; stroke: #c9c6bc; }
      .store { fill: #2a2d27; stroke: #4a504a; }
      .t, .body { fill: #f3efe6; }
      .sub, .code { fill: #98968d; }
      .ok { fill: rgba(95,208,138,0.12); stroke: #5fd08a; }
      .oktext { fill: #5fd08a; }
      .no { fill: rgba(255,138,125,0.12); stroke: #ff8a7d; }
      .notext { fill: #ff8a7d; }
      .check { fill: rgba(240,180,90,0.10); stroke: #f0b45a; }
      .flow { stroke: #c9c6bc; }
      .lbl { fill: #c9c6bc; }
    }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5664"/>
    </marker>
  </defs>
  <rect class="bg" width="760" height="320"/>
  <text class="t" x="380" y="26" text-anchor="middle">结案：模型只负责声明，runtime 负责核对</text>

  <rect class="step" x="24" y="52" width="130" height="52" rx="8"/>
  <text class="body" x="89" y="74" text-anchor="middle">assemble</text>
  <text class="sub" x="89" y="92" text-anchor="middle">组装 report.md</text>
  <path class="flow" d="M 154 78 L 188 78"/>

  <rect class="step" x="190" y="46" width="170" height="64" rx="8"/>
  <text class="body" x="275" y="68" text-anchor="middle">complete_research</text>
  <text class="code" x="275" y="86" text-anchor="middle">Q1 answered [c1,c2]</text>
  <text class="code" x="275" y="100" text-anchor="middle">Q2 not_found</text>
  <path class="flow" d="M 360 78 L 380 78"/>

  <rect class="check" x="382" y="40" width="232" height="76" rx="8"/>
  <text class="body" x="498" y="58" text-anchor="middle">runtime 核对</text>
  <text class="sub" x="394" y="76">· 计划里每题都声明了？</text>
  <text class="sub" x="394" y="91">· answered 的卡片 verified 且被引用？</text>
  <text class="sub" x="394" y="106">· 子 agent 都收完了？not_found 有卡片？</text>

  <path class="flow" d="M 614 62 L 650 62"/>
  <rect class="ok" x="652" y="46" width="84" height="32" rx="8"/>
  <text class="oktext" x="694" y="66" text-anchor="middle">accepted</text>
  <path class="flow" d="M 694 78 L 694 112"/>
  <rect class="step" x="652" y="114" width="84" height="32" rx="8"/>
  <text class="body" x="694" y="134" text-anchor="middle">Final</text>

    <rect class="no" x="652" y="162" width="84" height="32" rx="8"/>
  <text class="notext" x="694" y="182" text-anchor="middle">rejected</text>
  <path class="flow" d="M 614 100 Q 633 100 633 178 L 650 178"/>
  <path class="flow" d="M 652 186 Q 640 200 616 200"/>
  <rect class="step" x="382" y="150" width="232" height="58" rx="8"/>
  <text class="body" x="498" y="170" text-anchor="middle">problems 清单</text>
  <text class="code" x="498" y="186" text-anchor="middle">Q2 not_found without a usable card:</text>
  <text class="code" x="498" y="199" text-anchor="middle">run one more targeted round</text>
    <rect class="step" x="190" y="150" width="170" height="58" rx="8"/>
  <text class="body" x="275" y="172" text-anchor="middle">针对 Q2 补查一轮</text>
  <text class="sub" x="275" y="190" text-anchor="middle">新查询 · 其他来源家族 · 未读线索</text>
  <path class="flow" d="M 382 179 L 362 179"/>
  <path class="flow" d="M 275 150 L 275 112"/>
  <text class="lbl" x="282" y="134">再声明一次；每题只强制补查一次</text>

  <rect class="store" x="24" y="232" width="712" height="64" rx="8"/>
  <text class="body" x="40" y="254">落库 research_report_versions.completion</text>
  <text class="code" x="40" y="272">stop_reason: answered | partially_answered | budget | undeclared</text>
  <text class="code" x="40" y="286">questions[] · rejected_declarations · saturation.rounds[{decision, reads, readers_collected, new_cards}]</text>
</svg>
