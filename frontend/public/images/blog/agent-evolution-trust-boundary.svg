<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #fffdf8; }
    .zone { fill: #ffffff; stroke: #b9c4bf; stroke-width: 1.2; }
    .locked { fill: rgba(180,83,9,0.10); stroke: #b45309; stroke-width: 1.6; }
    .h { fill: #171b18; font-size: 16px; font-weight: 700; }
    .hl { fill: #b45309; font-size: 16px; font-weight: 700; }
    .li { fill: #171b18; font-size: 13.5px; }
    .meta { fill: #737a73; font-size: 12px; }
    .wall { stroke: #b45309; stroke-width: 2.4; stroke-dasharray: 6 4; }
    .walltext { fill: #b45309; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
    .flow { stroke: #4f5664; stroke-width: 1.3; fill: none; }
    .lbl { fill: #4f5664; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d19; }
      .zone { fill: #2a2d27; stroke: #4a504a; }
      .locked { fill: rgba(224,163,90,0.14); stroke: #e0a35a; }
      .h, .li { fill: #f3efe6; }
      .hl, .walltext { fill: #e0a35a; }
      .meta { fill: #98968d; }
      .wall { stroke: #e0a35a; }
      .flow { stroke: #c9c6bc; }
      .lbl { fill: #c9c6bc; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5664"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="300" rx="10"/>

  <rect class="zone" x="24" y="24" width="330" height="236" rx="10"/>
  <text class="h" x="44" y="54">提案方可以改</text>
  <text class="li" x="44" y="86">· 系统 Prompt 和 Skill</text>
  <text class="li" x="44" y="112">· 经验知识库</text>
  <text class="li" x="44" y="138">· 工具、工作流、重试与熔断策略</text>
  <text class="li" x="44" y="164">· Harness 代码（走 worktree + PR）</text>
  <text class="meta" x="44" y="206">改动先进入待验证区，</text>
  <text class="meta" x="44" y="224">不服务真实流量。</text>

  <line class="wall" x1="380" y1="20" x2="380" y2="280"/>
  <text class="walltext" x="380" y="292" text-anchor="middle">信任边界</text>

  <rect class="locked" x="406" y="24" width="330" height="236" rx="10"/>
  <text class="hl" x="426" y="54">提案方够不着</text>
  <text class="li" x="426" y="86">· 验证器和评分逻辑</text>
  <text class="li" x="426" y="112">· 边界集、保留集、安全测试用例</text>
  <text class="li" x="426" y="138">· 发布门槛阈值（如 GATE_BOUNDARY_RATE）</text>
  <text class="li" x="426" y="164">· 审计日志和稳定版本备份</text>
  <text class="meta" x="426" y="206">网页、工具输出及其 LLM 摘要</text>
  <text class="meta" x="426" y="224">一律只当证据，不当指令。</text>
</svg>
