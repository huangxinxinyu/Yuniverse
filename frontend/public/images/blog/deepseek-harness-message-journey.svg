<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #fffdf8; }
    .box { fill: #ffffff; stroke: #4f5664; stroke-width: 1.1; }
    .acc { fill: rgba(15,118,110,0.12); stroke: #0f766e; stroke-width: 1.4; }
    .dur { fill: rgba(180,83,9,0.12); stroke: #b45309; stroke-width: 1.4; }
    .name { fill: #171b18; font-size: 14px; font-weight: 600; }
    .accname { fill: #0f766e; font-size: 14px; font-weight: 600; }
    .durname { fill: #b45309; font-size: 14px; font-weight: 600; }
    .lbl { fill: #4f5664; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
    .durlbl { fill: #b45309; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
    .meta { fill: #737a73; font-size: 11.5px; }
    .life { stroke: #b9c4bf; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .ln { stroke: #4f5664; stroke-width: 1.2; fill: none; }
    .lndur { stroke: #b45309; stroke-width: 1.8; fill: none; }
    .num { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif; }
    .foot { fill: #737a73; font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d19; }
      .box { fill: #2a2d27; stroke: #c9c6bc; }
      .acc { fill: rgba(95,196,184,0.14); stroke: #5fc4b8; }
      .dur { fill: rgba(224,163,90,0.14); stroke: #e0a35a; }
      .name { fill: #f3efe6; }
      .accname { fill: #5fc4b8; }
      .durname, .durlbl { fill: #e0a35a; }
      .lbl { fill: #c9c6bc; }
      .meta, .num { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif; }
    .foot { fill: #98968d; }
      .life { stroke: #4a504a; }
      .ln { stroke: #c9c6bc; }
      .lndur { stroke: #e0a35a; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5664"/></marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="500" rx="10"/>

  <rect class="box" x="24" y="16" width="130" height="34" rx="6"/><text class="name" x="89" y="38" text-anchor="middle">浏览器 Client</text>
  <rect class="box" x="214" y="16" width="130" height="34" rx="6"/><text class="name" x="279" y="38" text-anchor="middle">Gateway</text>
  <rect class="acc" x="404" y="16" width="140" height="34" rx="6"/><text class="accname" x="474" y="38" text-anchor="middle">agent-loop</text>
  <rect class="dur" x="604" y="16" width="134" height="34" rx="6"/><text class="durname" x="671" y="38" text-anchor="middle">Session 日志</text>
  <g class="life"><line x1="89" y1="50" x2="89" y2="462"/><line x1="279" y1="50" x2="279" y2="462"/><line x1="474" y1="50" x2="474" y2="462"/><line x1="671" y1="50" x2="671" y2="462"/></g>

  <path class="ln" d="M89,84 L277,84" marker-end="url(#ar)"/><text class="lbl" x="100" y="76"><tspan class="num">①</tspan> remote.sessions.prompt()</text>
  <path class="ln" d="M279,122 L472,122" marker-end="url(#ar)"/><text class="lbl" x="290" y="114"><tspan class="num">②</tspan> 投递 agent.inbox</text>
  <path class="ln" d="M474,154 h60 v22 h-58" marker-end="url(#ar)"/><text class="lbl" x="542" y="164"><tspan class="num">③</tspan> pre-step [waterfall]</text><text class="meta" x="542" y="180">压缩、注入上下文</text>
  <path class="lndur" d="M474,214 L669,214" marker-end="url(#ard)"/><text class="durlbl" x="486" y="206"><tspan class="num">④</tspan> user/message · request/header</text>
  <path class="ln" d="M474,246 h60 v22 h-58" marker-end="url(#ar)"/><text class="lbl" x="542" y="256"><tspan class="num">⑤</tspan> llm/stream → 模型</text><text class="meta" x="542" y="272">llm-retry 包在外面</text>
  <path class="lndur" d="M474,300 L669,300" marker-end="url(#ard)"/><text class="durlbl" x="486" y="292">assistant/message</text>
  <path class="ln" d="M474,326 h60 v22 h-58" marker-end="url(#ar)"/><text class="lbl" x="542" y="336"><tspan class="num">⑥</tspan> tools/pre → exec → post</text><text class="meta" x="542" y="352">审批、沙箱、改写结果</text>
  <path class="lndur" d="M474,378 L669,378" marker-end="url(#ard)"/><text class="durlbl" x="486" y="370">tool/result · step/end</text>
  <path class="lndur" d="M671,410 L281,410" marker-end="url(#ard)"/><text class="durlbl" x="476" y="402" text-anchor="middle"><tspan class="num">⑦</tspan> session/event 广播</text>
  <path class="ln" d="M279,444 L91,444" marker-end="url(#ar)"/><text class="lbl" x="185" y="436" text-anchor="middle"><tspan class="num">⑧</tspan> follow() 流</text>

  <text class="foot" x="24" y="486">橙色箭头都是落盘的 session 事件。loop 只负责写日志，界面只负责读日志。</text>
</svg>
