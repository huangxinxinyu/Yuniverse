<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #fffdf8; }
    .zone { fill: #f3f1ea; stroke: #b9c4bf; stroke-width: 1.2; }
    .group { fill: none; stroke: #b9c4bf; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .box { fill: #ffffff; stroke: #4f5664; stroke-width: 1.1; }
    .acc { fill: rgba(15,118,110,0.12); stroke: #0f766e; stroke-width: 1.4; }
    .dur { fill: rgba(180,83,9,0.12); stroke: #b45309; stroke-width: 1.4; }
    .h { fill: #737a73; font-size: 12px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; }
    .name { fill: #171b18; font-size: 14px; font-weight: 600; }
    .t { fill: #171b18; font-size: 13.5px; }
    .meta { fill: #737a73; font-size: 11.5px; }
    .lbl { fill: #737a73; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
    .accname { fill: #0f766e; font-size: 14px; font-weight: 600; }
    .durname { fill: #b45309; font-size: 14px; font-weight: 600; }
    .durlbl { fill: #b45309; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
    .ln { stroke: #4f5664; stroke-width: 1.2; fill: none; }
    .lnacc { stroke: #0f766e; stroke-width: 1.6; fill: none; }
    .lndur { stroke: #b45309; stroke-width: 1.8; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d19; }
      .zone { fill: #22251f; stroke: #4a504a; }
      .group { stroke: #4a504a; }
      .box { fill: #2a2d27; stroke: #c9c6bc; }
      .acc { fill: rgba(95,196,184,0.14); stroke: #5fc4b8; }
      .dur { fill: rgba(224,163,90,0.14); stroke: #e0a35a; }
      .name, .t { fill: #f3efe6; }
      .h, .meta, .lbl { fill: #98968d; }
      .accname { fill: #5fc4b8; }
      .durname, .durlbl { fill: #e0a35a; }
      .ln { stroke: #c9c6bc; }
      .lnacc { stroke: #5fc4b8; }
      .lndur { stroke: #e0a35a; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5664"/></marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="620" rx="10"/>

  <!-- HOST -->
  <rect class="zone" x="16" y="16" width="604" height="440" rx="10"/>
  <text class="h" x="32" y="38">HOST 进程 · NODE · CORDIS 根 CTX</text>

  <text class="meta" x="32" y="64">① 核心主干（也都是插件，可替换）</text>
  <rect class="dur" x="32" y="72" width="90" height="48" rx="6"/><text class="name" x="42" y="92">sessions</text><text class="meta" x="42" y="109">事件日志</text>
  <rect class="acc" x="130" y="72" width="118" height="48" rx="6"/><text class="name" x="138" y="92">systemPrompt</text><text class="meta" x="138" y="109">prompt 组装</text>
  <rect class="acc" x="256" y="72" width="90" height="48" rx="6"/><text class="name" x="266" y="92">tools</text><text class="meta" x="266" y="109">注册表 + 管线</text>
  <rect class="acc" x="354" y="72" width="78" height="48" rx="6"/><text class="name" x="364" y="92">agents</text><text class="meta" x="364" y="109">Agent 接口</text>
  <rect class="acc" x="440" y="72" width="88" height="48" rx="6"/><text class="name" x="450" y="92">agentLoop</text><text class="meta" x="450" y="109">turn / step</text>
  <rect class="acc" x="536" y="72" width="68" height="48" rx="6"/><text class="name" x="546" y="92">llm</text><text class="meta" x="546" y="109">适配器接口</text>

  <rect class="group" x="28" y="138" width="580" height="106" rx="8"/>
  <text class="meta" x="40" y="158">② 能力 seam：接口定义 / 实现 / 使用方，三者分开</text>
  <rect class="box" x="40" y="168" width="132" height="64" rx="6"/><text class="name" x="52" y="188">fs</text><text class="lbl" x="52" y="206">local │ ssh</text><text class="lbl" x="52" y="222">sandbox</text>
  <rect class="box" x="180" y="168" width="132" height="64" rx="6"/><text class="name" x="192" y="188">subprocess</text><text class="lbl" x="192" y="206">local │ ssh</text><text class="lbl" x="192" y="222">win32</text>
  <rect class="box" x="320" y="168" width="132" height="64" rx="6"/><text class="name" x="332" y="188">sandbox</text><text class="lbl" x="332" y="206">local │ ssh</text><text class="lbl" x="332" y="222">windows-acl</text>
  <rect class="box" x="460" y="168" width="136" height="64" rx="6"/><text class="name" x="472" y="188">shell · terminal</text><text class="lbl" x="472" y="206">lsp · jobs · spill</text><text class="lbl" x="472" y="222">credentials …</text>

  <rect class="group" x="28" y="256" width="580" height="80" rx="8"/>
  <text class="meta" x="40" y="276">③ 功能插件：挂在事件或服务上</text>
  <rect class="box" x="40" y="286" width="146" height="38" rx="6"/><text class="t" x="52" y="310">tool-fs / bash / web</text>
  <rect class="box" x="194" y="286" width="86" height="38" rx="6"/><text class="t" x="204" y="310">compaction</text>
  <rect class="box" x="288" y="286" width="96" height="38" rx="6"/><text class="t" x="300" y="310">subagent</text>
  <rect class="box" x="392" y="286" width="96" height="38" rx="6"/><text class="t" x="404" y="310">skill · mcp</text>
  <rect class="box" x="496" y="286" width="100" height="38" rx="6"/><text class="t" x="508" y="310">goal · plan …</text>

  <rect class="acc" x="28" y="352" width="580" height="88" rx="8"/>
  <text class="accname" x="44" y="376">④ API Gateway（typert）</text>
  <text class="meta" x="44" y="398">业务服务方法标 @Remote → 构建时生成 descriptor、codec 和 Client 类型</text>
  <text class="lbl" x="44" y="420">/api（unary） · /api/remote.mux（WebSocket 多路流） · remote-access 鉴权</text>

  <!-- CLIENT -->
  <rect class="zone" x="652" y="16" width="192" height="440" rx="10"/>
  <text class="h" x="666" y="38" style="letter-spacing:0;font-size:10.5px">CLIENT · 浏览器 · 也是 CORDIS</text>
  <rect class="box" x="664" y="56" width="168" height="52" rx="6"/><text class="name" x="676" y="77">Client Modules</text><text class="meta" x="676" y="95">按 boot graph 懒加载插件</text>
  <rect class="box" x="664" y="130" width="168" height="52" rx="6"/><text class="name" x="676" y="151">ctx.remote.&lt;ns&gt;</text><text class="meta" x="676" y="169">生成的 typed 方法</text>
  <rect class="box" x="664" y="204" width="168" height="52" rx="6"/><text class="name" x="676" y="225">Client Model</text><text class="meta" x="676" y="243">镜像 Host 状态，不依赖 React</text>
  <rect class="box" x="664" y="278" width="168" height="52" rx="6"/><text class="name" x="676" y="299">Conversation</text><text class="meta" x="676" y="317">日志窗口 → 视图快照</text>
  <rect class="box" x="664" y="352" width="168" height="52" rx="6"/><text class="name" x="676" y="373">Slots → React</text><text class="meta" x="676" y="391">ui-chat / ui-plan / ui-tool…</text>
  <g class="ln"><path d="M748,182 L748,202" marker-end="url(#ar)"/><path d="M748,256 L748,276" marker-end="url(#ar)"/><path d="M748,330 L748,350" marker-end="url(#ar)"/></g>

  <path class="lnacc" d="M608,396 C636,396 636,156 662,156" marker-end="url(#ara)" marker-start="url(#ara)"/>
  <text class="lbl" x="612" y="290" transform="rotate(-90 626 290)">RPC + 事件流</text>

  <!-- STORAGE -->
  <text class="h" x="32" y="486">存储</text>
  <rect class="dur" x="32" y="498" width="250" height="100" rx="8"/>
  <text class="durname" x="48" y="522">Session 日志 · JSONL(.zstd)</text>
  <text class="meta" x="48" y="544">session.vN.jsonl，按版本存多代</text>
  <text class="meta" x="48" y="562">升级时写新版本，旧文件不改不删</text>
  <text class="durlbl" x="48" y="584">v0 → v1 → v2 → v3 → v4</text>
  <rect class="box" x="300" y="498" width="150" height="100" rx="8"/><text class="name" x="314" y="522">session-query</text><text class="lbl" x="314" y="542">sqlite</text><text class="meta" x="314" y="562">搜索 / 列表的索引</text><text class="meta" x="314" y="580">从日志派生，不是事实</text>
  <rect class="box" x="466" y="498" width="140" height="100" rx="8"/><text class="name" x="480" y="522">storage</text><text class="lbl" x="480" y="542">json │ sqlite</text><text class="meta" x="480" y="562">设置、元数据</text>
  <path class="lndur" d="M77,120 L77,496" marker-end="url(#ard)"/>
  <text class="durlbl" x="86" y="470">append 每个事件</text>
  <path class="ln" d="M282,548 L298,548" marker-end="url(#ar)"/>

  <!-- legend -->
  <rect class="acc" x="652" y="498" width="14" height="10" rx="2"/><text class="meta" x="672" y="507">核心主干（也是插件）</text>
  <rect class="dur" x="652" y="520" width="14" height="10" rx="2"/><text class="meta" x="672" y="529">落盘的事实来源</text>
  <rect class="group" x="652" y="542" width="14" height="10" rx="2"/><text class="meta" x="672" y="551">分组边界</text>
</svg>
