<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif">
  <style>
    .bg { fill: #fffdf8; }
    .check { fill: #ffffff; stroke: #4f5664; stroke-width: 1.1; }
    .code { fill: #737a73; font-size: 10.5px; font-family: ui-monospace, Menlo, monospace; }
    .t { fill: #171b18; font-size: 13px; font-weight: 600; }
    .meta { fill: #737a73; font-size: 12px; }
    .ok { fill: rgba(29,122,62,0.10); stroke: #1d7a3e; stroke-width: 1.4; }
    .oktext { fill: #1d7a3e; font-size: 13px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
    .no { fill: rgba(180,55,43,0.10); stroke: #b4372b; stroke-width: 1.4; }
    .notext { fill: #b4372b; font-size: 13px; font-weight: 600; font-family: ui-monospace, Menlo, monospace; }
    .flow { stroke: #4f5664; stroke-width: 1.3; fill: none; }
    .lbl { fill: #4f5664; font-size: 12px; }
    .brace { stroke: #b9c4bf; stroke-width: 1.2; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d19; }
      .check { fill: #2a2d27; stroke: #c9c6bc; }
      .t { fill: #f3efe6; }
      .code, .meta { fill: #98968d; }
      .ok { fill: rgba(95,208,138,0.12); stroke: #5fd08a; }
      .oktext { fill: #5fd08a; }
      .no { fill: rgba(255,138,125,0.12); stroke: #ff8a7d; }
      .notext { fill: #ff8a7d; }
      .flow { stroke: #c9c6bc; }
      .lbl { fill: #c9c6bc; }
      .brace { stroke: #4a504a; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5664"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="230" rx="10"/>
  <text class="meta" x="24" y="32">release_gate.py 的五项检查，全部通过才进灰度</text>

  <rect class="check" x="24" y="48" width="100" height="62" rx="8"/><text class="t" x="36" y="72">补丁非空</text><text class="code" x="36" y="96">nonempty</text>
  <rect class="check" x="134" y="48" width="118" height="62" rx="8"/><text class="t" x="146" y="72">old → new</text><text class="t" x="146" y="88">精确编辑</text><text class="code" x="146" y="103">auditable_edit</text>
  <rect class="check" x="262" y="48" width="108" height="62" rx="8"/><text class="t" x="274" y="72">记录了</text><text class="t" x="274" y="88">来源用例</text><text class="code" x="274" y="103">source_cases</text>
  <rect class="check" x="380" y="48" width="112" height="62" rx="8"/><text class="t" x="392" y="72">保留集</text><text class="t" x="392" y="88">没有退化</text><text class="code" x="392" y="103">holdout_ok</text>
  <rect class="check" x="502" y="48" width="112" height="62" rx="8"/><text class="t" x="514" y="72">边界集</text><text class="t" x="514" y="88">确有改善</text><text class="code" x="514" y="103">boundary_up</text>

  <path class="brace" d="M24,124 L24,132 L614,132 L614,124"/>
  <path class="flow" d="M319,132 L319,150" marker-end="url(#ar)"/>
  <text class="lbl" x="319" y="170" text-anchor="middle">五项全过？</text>
  <path class="flow" d="M250,164 L124,164 L124,178" marker-end="url(#ar)"/>
  <text class="lbl" x="200" y="156" text-anchor="middle">否，任一失败</text>
  <path class="flow" d="M388,164 L623,164 L623,178" marker-end="url(#ar)"/>
  <text class="lbl" x="448" y="156" text-anchor="middle">是</text>
  <rect class="no" x="24" y="180" width="200" height="34" rx="6"/><text class="notext" x="124" y="202" text-anchor="middle">reject_candidate · 丢弃</text>
  <rect class="ok" x="510" y="180" width="226" height="34" rx="6"/><text class="oktext" x="623" y="202" text-anchor="middle">release_to_canary · 灰度</text>
</svg>
